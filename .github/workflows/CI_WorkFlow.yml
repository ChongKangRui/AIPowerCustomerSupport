name: CI Workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prevent multiple workflow run at the same time 
# if multiple push happen in short amount of time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runTest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level, not per-step: every step in this job needs to resolve a DB
    # connection string via lib/database-url.ts's resolveDatabaseUrl(), which
    # throws without DB_PASSWORD — even "npm ci", since its postinstall hook
    # runs `prisma generate`, which loads prisma.config.ts, which calls that
    # same function. Setting it here once means every current AND future
    # step in this job gets it automatically, instead of it being something
    # you have to remember to add to each new step individually.
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: CustomerSupportDB_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install playright chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit test
        run: npm run test

      - name: Run end to end test
        run: npm run test:e2e
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_TRUST_HOST: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

